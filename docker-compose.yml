# Local stack: the agent team (experts, inspector, data agent), the Redshift stand-in and the docs.
#   cp .env.example .env                        # choose the models (INSPECTOR_LLM_MODEL_*)
#   docker compose up -d                        # agents + warehouse
#   docker compose --profile local-llm up -d    # also start Ollama in a container
#   docker compose --profile docs up -d         # docs site + tunnel
# Agents call the model provider directly (LiteLLM library inside each agent, no proxy).
services:
  # Optional local models. A native Ollama on the Mac is faster (Metal): set
  # INSPECTOR_LLM_API_BASE=http://host.docker.internal:11434 instead.
  ollama:
    image: ollama/ollama:0.34.1
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # Redshift stand-in seeded with the synthetic retail warehouse.
  #   cd synthetic && uv run inspector-synth warehouse     # writes CSVs + init scripts first
  #   docker compose up -d warehouse                      # read-only login: inspector_ro / inspector_ro
  warehouse:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: inspector_admin
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:-inspector_admin}
    ports:
      - "5439:5432"
    volumes:
      - ./synthetic/warehouse/postgres:/docker-entrypoint-initdb.d:ro
      - ./synthetic/warehouse/data:/seed/data:ro
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspector_admin -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The agent team. Each agent is an independent A2A server (port 9000, agent card at /.well-known/agent-card.json),
  # one AgentCore runtime each when deployed. Packages are mounted read-only at /packages (S3 on AgentCore).
  thoughtspot-agent:
    build:
      context: .
      dockerfile: packages/thoughtspot_agent/Dockerfile
    ports:
      - "9001:9000"
    environment: &agent-env
      AGENTCORE_RUNTIME_URL: http://thoughtspot-agent:9000/
      INSPECTOR_LLM_MODEL_STRONG: ${INSPECTOR_LLM_MODEL_STRONG:-ollama_chat/qwen3:14b}
      INSPECTOR_LLM_MODEL_FAST: ${INSPECTOR_LLM_MODEL_FAST:-ollama_chat/qwen3:8b}
      INSPECTOR_LLM_API_BASE: ${INSPECTOR_LLM_API_BASE:-http://host.docker.internal:11434}
      INSPECTOR_LLM_API_KEY: ${INSPECTOR_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Tracing (OpenTelemetry → Langfuse); unset keys = no export
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      INSPECTOR_TRACE_CONTENT: ${INSPECTOR_TRACE_CONTENT:-true}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: "false"   # a2a-sdk's internal spans are noise here
      PACKAGE_ROOT: /packages:/uploads   # synthetic packages, and what developers upload in the portal
    volumes: &packages
      - ./synthetic/packages:/packages:ro
      - portal-uploads:/uploads:ro
    restart: unless-stopped

  strategy-agent:
    build:
      context: .
      dockerfile: packages/strategy_agent/Dockerfile
    ports:
      - "9002:9000"
    environment:
      <<: *agent-env
      AGENTCORE_RUNTIME_URL: http://strategy-agent:9000/
    volumes: *packages
    restart: unless-stopped

  # The only agent with warehouse credentials (read-only role). On AgentCore: Redshift DSN from Secrets Manager,
  # WAREHOUSE_DIALECT=redshift.
  data-agent:
    build:
      context: .
      dockerfile: packages/data_agent/Dockerfile
    ports:
      - "9003:9000"
    environment:
      <<: *agent-env
      AGENTCORE_RUNTIME_URL: http://data-agent:9000/
      WAREHOUSE_DSN: postgresql://inspector_ro:inspector_ro@warehouse:5432/analytics
      WAREHOUSE_DIALECT: postgres        # SQL arrives in Redshift dialect and is transpiled
      WAREHOUSE_ALLOWED_SCHEMAS: retail
      WAREHOUSE_TIMEOUT_S: "60"
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  inspector-agent:
    build:
      context: .
      dockerfile: packages/inspector_agent/Dockerfile
    ports:
      - "9000:9000"
    environment:
      <<: *agent-env
      AGENTCORE_RUNTIME_URL: http://inspector-agent:9000/
      INSPECTOR_THOUGHTSPOT_AGENT_URL: http://thoughtspot-agent:9000/
      INSPECTOR_STRATEGY_AGENT_URL: http://strategy-agent:9000/
      INSPECTOR_DATA_AGENT_URL: http://data-agent:9000/
      INSPECTOR_A2A_AUTH: none           # sigv4 on AgentCore
      INSPECTOR_RUNS_DIR: /runs          # report.md, report.json, run.json per validation
    volumes:
      - ./synthetic/packages:/packages:ro
      - portal-uploads:/uploads:ro
      - ./runs:/runs
    depends_on:
      - thoughtspot-agent
      - strategy-agent
      - data-agent
    restart: unless-stopped

  # Developer portal: FastAPI backend (the lasting API) + Streamlit UI on http://localhost:8501.
  #   share: ngrok http 8501 --basic-auth "user:password"   (the URL is public; never expose it without auth)
  portal-api:
    build:
      context: .
      dockerfile: packages/inspector_portal/Dockerfile
    environment:
      PORTAL_DATA_DIR: /data
      PORTAL_UPLOADS_DIR: /uploads
      PORTAL_AGENT_UPLOADS_PATH: /uploads
      PORTAL_INSPECTOR_URL: http://inspector-agent:9000/
      PORTAL_THOUGHTSPOT_URL: http://thoughtspot-agent:9000/
      PORTAL_STRATEGY_URL: http://strategy-agent:9000/
      PORTAL_MAX_PARALLEL_RUNS: "2"
    volumes:
      - portal-data:/data
      - portal-uploads:/uploads
    ports:
      - "8080:8080"
    depends_on:
      - inspector-agent
    restart: unless-stopped

  portal-ui:
    build:
      context: .
      dockerfile: packages/inspector_portal/Dockerfile
    command: ["streamlit", "run", "/app/packages/inspector_portal/inspector_portal/ui.py",
              "--server.port", "8501", "--server.address", "0.0.0.0", "--server.maxUploadSize", "200"]
    environment:
      PORTAL_API_URL: http://portal-api:8080
    ports:
      - "8501:8501"
    depends_on:
      - portal-api
    restart: unless-stopped

  # Design docs (Astro Starlight) and a Cloudflare quick tunnel to share them.
  #   docker compose --profile docs up -d --build
  #   docker compose logs docs-tunnel | grep trycloudflare.com    # public URL
  docs:
    build: ./site
    profiles: ["docs"]
    ports:
      - "4321:80"
    restart: unless-stopped

  docs-tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["docs"]
    # http2 (TCP) instead of the default QUIC: QUIC idle timeouts dropped the tunnel, and a quick
    # tunnel that drops for long enough is deleted server-side and never comes back.
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://docs:80"]
    depends_on:
      - docs
    restart: unless-stopped

volumes:
  portal-data:
  portal-uploads:
  ollama-models:
  warehouse-data:
