[project]
name = "inspector-contract"
version = "0.1.0"
description = "Shared contract of the Inspector agent team: IR data types, model-export envelope, A2A conventions."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5,<3",
    "a2a-sdk[http-server]==0.3.26",
    "httpx>=0.28.1,<1",
    "boto3>=1.40",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspector_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
