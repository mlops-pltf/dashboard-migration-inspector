[project]
name = "inspector-portal"
version = "0.1.0"
description = "Developer portal for the Inspector: upload a migration package, run a validation, read the report, ask follow-ups."
requires-python = ">=3.12"
dependencies = [
    "inspector-contract",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "streamlit==1.65.0",
    "httpx>=0.28.1,<1",
    "pyyaml>=6",
]

[project.scripts]
inspector-portal-api = "inspector_portal.api:main"

[tool.uv.sources]
inspector-contract = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspector_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
