[project]
name = "strategy-agent"
version = "0.1.0"
description = "Inspector team: strategy expert agent (A2A)."
requires-python = ">=3.12"
dependencies = [
    "inspector-contract",
    "ruamel.yaml>=0.19.1,<0.20",
    "sqlglot==30.21.0",
    "strands-agents==1.59.0",
    "bedrock-agentcore[a2a]==1.24.0",
]

[project.optional-dependencies]
runpod = ["strands-agents[openai]==1.59.0"]  # an OpenAI-compatible model server (INSPECTOR_LLM_API_BASE); Bedrock needs nothing extra

[project.scripts]
strategy-agent = "strategy_agent.strategy_agent:main"

[tool.uv.sources]
inspector-contract = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
