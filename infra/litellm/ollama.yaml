# LiteLLM profile: local Ollama. Use tool-calling capable models and pull them first:
#   docker compose exec ollama ollama pull qwen3:14b && docker compose exec ollama ollama pull qwen3:8b
# OLLAMA_API_BASE defaults to the compose `ollama` service; set it to
# http://host.docker.internal:11434 to use an Ollama running natively on the Mac (faster: uses Metal).
model_list:
  - model_name: inspector-strong
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: os.environ/OLLAMA_API_BASE
      temperature: 0
  - model_name: inspector-fast
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE
      temperature: 0

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
