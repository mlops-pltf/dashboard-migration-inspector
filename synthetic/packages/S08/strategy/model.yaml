    physicalTable:
      information:
        primaryLocale: en-US
        objectId: 2F1BCCF9972BFE38D3685D31CC54A198
        subType: physical_table
        name: fact_orders
      type: sql
      sqlStatement: |-
        SELECT
            o.order_id,
            o.order_ts,
            o.order_date,
            o.customer_id,
            o.store_id,
            o.order_status,
            o.order_amount,
            o.discount_amount,
            o.shipping_amount,
            o.item_count
        FROM analytics.retail.fact_orders o
        WHERE o.order_status <> 'Cancelled'
