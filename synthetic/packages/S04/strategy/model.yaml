  tables:
  - information:
      primaryLocale: en-US
      objectId: DE1AE6BEBC67F253ECB410E28ECCB523
      subType: logical_table
      name: Sales Orders SQL
    physicalTable:
      information:
        primaryLocale: en-US
        objectId: 6BBB66A7198587D51087595451DE9EC1
        subType: physical_table
        name: Sales Orders SQL
      type: sql
      sqlStatement: |-
        SELECT
            o.order_id,
            o.order_date,
            o.order_status,
            o.customer_id,
            o.store_id,
            c.customer_name,
            c.segment,
            c.region AS customer_region,
            s.store_name,
            s.city,
            s.region AS store_region,
            s.store_type,
            d.week_start_monday,
            d.month_start,
            d.quarter,
            d.year,
            d.fiscal_year,
            o.order_amount,
            o.discount_amount,
            o.shipping_amount,
            o.item_count,
            p.category AS product_category
        FROM analytics.retail.fact_orders o
        LEFT JOIN analytics.retail.dim_customer c ON c.customer_id = o.customer_id
        LEFT JOIN analytics.retail.dim_store s ON s.store_id = o.store_id
        LEFT JOIN analytics.retail.dim_date d ON d.date_key = o.order_date
        JOIN analytics.retail.fact_order_lines l ON l.order_id = o.order_id
        LEFT JOIN analytics.retail.dim_product p ON p.product_id = l.product_id
        WHERE o.order_status <> 'Cancelled'
