    physicalTable:
      information:
        primaryLocale: en-US
        objectId: 32C45BEBB1A5B9A1E762483E235B37F1
        subType: physical_table
        name: Returns Analysis SQL
      type: sql
      sqlStatement: |-
        SELECT
            p.product_id,
            p.category,
            p.subcategory,
            p.brand,
            l.line_amount,
            l.quantity,
            r.refund_amount,
            r.return_qty
        FROM analytics.retail.fact_order_lines l
        LEFT JOIN analytics.retail.dim_product p ON p.product_id = l.product_id
        LEFT JOIN analytics.retail.fact_returns r ON p.product_id = r.product_id
      columns:
      - information:
          primaryLocale: en-US
          objectId: E6A0B5275B90C2D5AE53545B44D40AA7
          subType: column
          name: product_id
        dataType:
