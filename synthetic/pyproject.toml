[project]
name = "inspector-synth"
version = "0.1.0"
description = "Synthetic ThoughtSpot TML + Strategy Mosaic packages with injected defects and ground truth for Inspector."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.3",
]

[project.scripts]
inspector-synth = "inspector_synth.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspector_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
